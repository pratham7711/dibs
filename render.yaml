services:
  - type: web
    name: dibs
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: DIBS_PUBLIC_DEMO
        value: "1"
      - key: DIBS_LLM_TOKEN_BUDGET
        value: "60000"
      - key: GROQ_API_KEY
        sync: false
